<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>三十年人生計畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: sticky tab bar over a calm sage-paper page; one column of panels, 2-up on wide screens. */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --sunk:#E8ECE5; --fg:#1B231F; --muted:#5D6963; --line:#D3DBD1;
  --accent:#2C6953; --accent-ink:#FFFFFF; --warn:#A35E22; --danger:#B0443F;
  --c-health:#3A8761; --c-family:#BF6C27; --c-money:#9C7B1C; --c-travel:#2A739B;
  --c-social:#B25252; --c-learn:#6654A3; --c-career:#536576;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101412; --surface:#181D1A; --sunk:#0B0E0C; --fg:#E3E9E4; --muted:#98A49D; --line:#2A332E;
  --accent:#71B99B; --accent-ink:#0D1411; --warn:#D99555; --danger:#E07772;
  --c-health:#6CC198; --c-family:#E39A57; --c-money:#D3B04E; --c-travel:#62A9D2;
  --c-social:#E08484; --c-learn:#A796E0; --c-career:#93A5B6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181D1A; --sunk:#0B0E0C; --fg:#E3E9E4; --muted:#98A49D; --line:#2A332E;
  --accent:#71B99B; --accent-ink:#0D1411; --warn:#D99555; --danger:#E07772;
  --c-health:#6CC198; --c-family:#E39A57; --c-money:#D3B04E; --c-travel:#62A9D2;
  --c-social:#E08484; --c-learn:#A796E0; --c-career:#93A5B6; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:clamp(26px,4.4vw,38px)}
h2{font-size:21px}
h3{font-size:16px}
p{margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* lock */
.lock{min-height:100vh;display:grid;place-items:center;padding-block:40px;padding-inline:16px}
.lock-card{width:min(460px,100%);display:grid;gap:16px}
.lock-card .seal{font-family:var(--serif);font-size:44px;font-weight:700;letter-spacing:.06em}
.lock-card .seal span{color:var(--accent)}

/* app chrome */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1120px;margin:0 auto;padding-block:8px;padding-inline:16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap}
.brand span{color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:7px 11px;border-radius:8px;white-space:nowrap;cursor:pointer}
nav.tabs button:hover{color:var(--fg);background:var(--sunk)}
nav.tabs button[aria-current="page"]{color:var(--fg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.save-state{font-size:12px;color:var(--muted);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 72px;padding-inline:16px;display:grid;gap:20px}

/* building blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;min-width:0;align-content:start}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:8px}
.banner{border:1px dashed var(--warn);color:var(--fg);background:color-mix(in oklab,var(--warn) 9%,var(--surface));border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}

input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.6}
input[type=number]{width:96px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
input[type=range]{accent-color:var(--accent);width:100%}
input.bare{border-color:transparent;background:transparent;padding-inline:4px}
input.bare:hover,input.bare:focus{border-color:var(--line);background:var(--bg)}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{font-size:13px;padding:4px 10px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--danger);background:var(--sunk)}
.msg{font-size:13px;min-height:1.2em}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:1px 9px;border-radius:999px;background:color-mix(in oklab,var(--c) 14%,transparent);color:var(--c);font-weight:500;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:3px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.check{display:flex;gap:10px;align-items:center;padding-block:3px}
.check input[type=text]{flex:1}
.check.done input[type=text]{color:var(--muted);text-decoration:line-through}

/* hero */
.hero{display:grid;gap:10px;padding-block:6px}
.hero .motto{font-family:var(--serif);font-size:17px;color:var(--muted);max-width:52ch}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:6px}
.stat b{display:block;font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* 79-year grid */
.life{display:grid;gap:5px;overflow-x:auto}
.life-row{display:grid;grid-template-columns:52px repeat(10,minmax(26px,1fr));gap:5px;align-items:center;min-width:360px}
.life-row .dec{font-family:var(--mono);font-size:11px;color:var(--muted)}
.yr{aspect-ratio:1/1;border-radius:6px;border:1px dashed var(--line);background:transparent;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;padding:0;max-width:100%}
.yr.past{border:0;background:color-mix(in oklab,var(--accent) 24%,var(--surface));color:var(--fg)}
.yr.now{border:0;background:var(--accent);color:var(--accent-ink);font-weight:500;box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 30%,transparent)}
.yr.planned{border-style:solid;border-color:color-mix(in oklab,var(--accent) 55%,var(--line))}
.yr.blank{visibility:hidden}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* bars */
.bar{display:grid;grid-template-columns:76px 1fr 40px;gap:10px;align-items:center}
.track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.fill{height:100%;background:var(--c,var(--accent));border-radius:99px}

/* timeline */
.decade{display:grid;grid-template-columns:120px 1fr;gap:16px;padding-block:16px;border-top:1px solid var(--line)}
.decade:first-child{border-top:0}
.decade-label h3{font-family:var(--mono);font-weight:500;font-size:20px}
.ev{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start;padding-block:6px}
.ev .y{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px}
.ev .t{font-weight:500}

/* phases */
.phase{border-top:3px solid var(--accent)}
.phase .years{font-family:var(--mono);font-size:13px;color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:14px}
.tbl{overflow-x:auto}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.05em;white-space:nowrap}
td.num{white-space:nowrap}
tr.cur td{background:color-mix(in oklab,var(--accent) 10%,transparent)}

.navbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.navbar h1{flex:1;min-width:0}
.ages{display:flex;gap:8px;flex-wrap:wrap}
.age{font-size:13px;background:var(--sunk);border-radius:999px;padding:2px 11px}
.age b{font-family:var(--mono);font-weight:500}

.cat-block{display:grid;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.cat-block:first-of-type{border-top:0}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 4px;text-align:center;cursor:pointer;font:inherit;color:var(--fg)}
.wday.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wday b{display:block;font-family:var(--mono);font-size:17px;font-weight:500}
.wday small{color:var(--muted);font-size:11px}
.habit{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--bg);cursor:pointer}
.goal{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.goal-top{display:flex;gap:8px;align-items:flex-start}
.goal-top .t{flex:1;font-weight:500;min-width:0}
.prog{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center}
details summary{cursor:pointer;font-weight:500}
.field{display:grid;gap:4px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}

/* sync pill */
.sync-pill{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 11px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sync-pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync-pill[data-state="idle"]::before{background:var(--accent)}
.sync-pill[data-state="dirty"]::before,.sync-pill[data-state="busy"]::before,.sync-pill[data-state="offline"]::before{background:var(--warn)}
.sync-pill[data-state="error"],.sync-pill[data-state="conflict"]{color:var(--danger);border-color:var(--danger)}
.sync-pill[data-state="error"]::before,.sync-pill[data-state="conflict"]::before{background:var(--danger)}
.banner.bad{border:1px solid var(--danger);background:color-mix(in oklab,var(--danger) 9%,var(--surface))}

/* vision */
.vision-hero{display:grid;gap:12px;padding-block:6px}
.vision-text{font-family:var(--serif);font-size:clamp(18px,2.4vw,23px);line-height:1.75;background:transparent;border:1px solid transparent;padding:6px 8px;margin-left:-8px;min-height:140px;max-width:40em}
.vision-text:hover,.vision-text:focus{border-color:var(--line);background:var(--surface)}
.vision-quote{font-family:var(--serif);font-size:16px;line-height:1.75;max-width:60ch}
.values{display:flex;gap:8px;flex-wrap:wrap}
.value{font-family:var(--serif);font-size:15px;padding:3px 4px 3px 14px;border:1px solid var(--line);border-radius:999px;display:inline-flex;gap:2px;align-items:center;background:var(--bg)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px;align-items:start}
.vcard{background:color-mix(in oklab,var(--c) 9%,var(--surface));border:1px solid color-mix(in oklab,var(--c) 32%,var(--line));border-radius:14px;overflow:hidden;display:grid;min-width:0}
.vcard img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;max-width:100%}
.vbody{padding:14px;display:grid;gap:10px;min-width:0}
.vt{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.4;width:100%;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:8px;padding:2px 6px;margin-left:-6px}
.vt:hover,.vt:focus{border-color:var(--line);background:var(--bg)}
.vcard textarea{background:color-mix(in oklab,var(--bg) 70%,transparent)}
.vcard .fill{background:var(--c)}
.linkgoal{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding-block:3px;cursor:pointer}
.linkgoal input{margin-top:2px}

/* mandala 9x9 */
.mwrap{overflow-x:auto;padding-bottom:4px}
.mandala{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-width:640px;max-width:920px;margin-inline:auto}
.mandala.zoom{grid-template-columns:minmax(0,1fr);min-width:0;max-width:560px}
.mblock{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px;border-radius:10px;background:var(--sunk)}
.mblock.core{background:color-mix(in oklab,var(--accent) 18%,var(--sunk))}
.mcell{aspect-ratio:1/1;max-width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);font:inherit;font-size:11.5px;line-height:1.3;padding:4px;display:grid;place-items:center;text-align:center;cursor:pointer;overflow:hidden;position:relative}
.mcell span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mcell:hover{border-color:var(--muted)}
.mcell.sel{outline:2px solid var(--fg);outline-offset:1px;z-index:1}
.mcell.center{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--serif);font-weight:700;font-size:13px}
.mcell.theme{background:color-mix(in oklab,var(--c) 24%,var(--surface));border-color:color-mix(in oklab,var(--c) 55%,var(--line));font-weight:700}
.mcell.empty{color:var(--muted);border-style:dashed;background:transparent}
.mcell.st1{box-shadow:inset 0 -3px 0 var(--warn)}
.mcell.st2{background:color-mix(in oklab,var(--c) 13%,var(--surface));box-shadow:inset 0 -3px 0 var(--c)}
.mcell.st3{background:color-mix(in oklab,var(--c) 32%,var(--surface))}
.mcell.st3::after{content:'✓';position:absolute;top:1px;right:4px;font-size:11px;font-weight:700;color:var(--c)}
.mandala.zoom .mcell{font-size:14px;padding:8px}
.mandala.zoom .mcell.center,.mandala.zoom .mcell.theme{font-size:16px}
.mlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mlegend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);margin-right:5px;vertical-align:-2px;background:var(--surface)}
.loglist{display:grid;gap:4px}
.logrow{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:start;font-size:14px}

@media (max-width:640px){
  .save-state{display:none}
  .decade{grid-template-columns:1fr;gap:6px}
  .brand{display:none}
  .stat b{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s ease}}
</style>
</head>
<body>

<div id="lock" class="lock">
  <div class="lock-card">
    <div class="seal">三十<span>年</span></div>
    <p class="muted">1978–2026 回顧 · 2026–2056 計畫。資料在你的瀏覽器裡用密碼加密（AES-256），沒有密碼誰都打不開。</p>
    <div class="panel" id="lockPanel"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-inner">
      <div class="brand">三十<span>年</span></div>
      <nav class="tabs" id="tabs"></nav>
      <span class="save-state" id="saveState"></span>
      <button class="sync-pill" id="syncPill" data-act="sync-now" data-state="off">未連線雲端</button>
      <button class="btn sm" data-act="lock">上鎖</button>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>

<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const CATS = [
  {id:'health', name:'健康',   subs:['身體健康','心理健康','佛學禪學','運動']},
  {id:'family', name:'家庭',   subs:['孩子','伴侶','母親']},
  {id:'money',  name:'金錢',   subs:['運用','財富管理','投資']},
  {id:'travel', name:'旅遊興趣', subs:['出國','收音機','手機']},
  {id:'social', name:'社交',   subs:['人際互動','社群 LINE']},
  {id:'learn',  name:'學習',   subs:['書本','網路學習','電腦','進修']},
  {id:'career', name:'事業',   subs:['工作','轉型']},
];
const PHASES = [
  {id:'p1', from:2026, to:2030, name:'重建期'},
  {id:'p2', from:2031, to:2040, name:'深耕期'},
  {id:'p3', from:2041, to:2050, name:'轉換期'},
  {id:'p4', from:2051, to:2056, name:'傳承期'},
];
const HORIZONS = ['終身','十年','年度'];
const TABS = [
  ['overview','總覽'],['vision','願景'],['mandala','九宮格'],['review','回顧 1978–2026'],['blueprint','30 年藍圖'],
  ['year','年計畫'],['week','週計畫'],['day','日計畫'],['goals','目標'],['settings','設定']];
const START=1978, NOW_Y=2026, END=2056;
const LS='lifeplan.v1';
const WD='日一二三四五六';

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const weekStart = d => addDays(d, -((d.getDay()+6)%7));
function isoWeekKey(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const n=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-n);
  const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return d.getUTCFullYear()+'-W'+pad(Math.ceil(((d-ys)/864e5+1)/7));
}
const cat = id => CATS.find(c=>c.id===id) || CATS[0];
const chip = id => `<span class="chip" style="--c:var(--c-${id})"><span class="dot"></span>${esc(cat(id).name)}</span>`;
const catOptions = sel => CATS.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.name}</option>`).join('');
const phaseOf = y => PHASES.find(p=>y>=p.from&&y<=p.to);
function lsGet(){ try{ return localStorage.getItem(LS); }catch(e){ return null; } }
function lsSet(v){ try{ localStorage.setItem(LS,v); return true; }catch(e){ return false; } }

/* ---------- crypto ---------- */
const enc=new TextEncoder(), dec=new TextDecoder();
function b64(u){ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
let KEY=null, SALT=null, D=null;
async function encryptData(forSync){
  const obj = forSync ? JSON.parse(JSON.stringify(D)) : D;
  if(forSync && obj.settings && obj.settings.gh) obj.settings.gh.token='';
  if(forSync) obj.sync={sha:null,dirty:false};
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(JSON.stringify(obj))));
  return JSON.stringify({app:'lifeplan',v:1,kdf:'PBKDF2-SHA256-250000',salt:b64(SALT),iv:b64(iv),ct:b64(ct),saved:new Date().toISOString()});
}
async function decryptBlob(blobStr,pw){
  const b=JSON.parse(blobStr);
  if(!b.ct) throw new Error('format');
  const salt=unb64(b.salt), key=await deriveKey(pw,salt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(b.iv)},key,unb64(b.ct));
  return {data:JSON.parse(dec.decode(pt)),key,salt};
}

  d.profile = Object.assign({name:'',birthYear:1978,childBirthYear:2021,motherBirthYear:'',motto:''}, d.profile||{});

let saveTimer=null, EDIT=0;
const hhmm = () => { const t=new Date(); return pad(t.getHours())+':'+pad(t.getMinutes()); };

const SYNC={timer:null,busy:false,state:'off',detail:'',at:'',conflict:null,lastCheck:0};
const SYNC_TEXT={off:'未連線雲端',idle:'已同步',dirty:'待同步',busy:'同步中…',offline:'離線中，稍後補傳',error:'同步失敗',conflict:'雲端版本衝突'};
function ghReady(){ const G=D&&D.settings&&D.settings.gh; return !!(G&&G.owner&&G.repo&&G.token&&G.path); }
function setSync(st,detail){
  SYNC.state=st; SYNC.detail=detail||'';
  const label=SYNC_TEXT[st]+(st==='idle'&&SYNC.at?' '+SYNC.at:'');
  const p=$('#syncPill'); if(p){ p.dataset.state=st; p.textContent=label; p.title=detail||'按一下立即同步'; }
  const m=$('#ghState'); if(m){ m.textContent=label+(detail?'：'+detail:''); m.className='msg '+(st==='error'||st==='conflict'?'err':st==='idle'?'ok':''); }
}
function schedulePush(){
  if(!ghReady()) return setSync('off');
  if(SYNC.conflict) return;
  if(!SYNC.busy) setSync(navigator.onLine?'dirty':'offline');
  clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(()=>pushNow(),45000);
}
async function fetchRemote(G){
  const r=await gh('GET',null,false,G);
  if(r.status===404) return null;
  if(!r.ok) throw new Error(await errText(r));
  const j=await r.json(); let txt;
  if(j.content && j.encoding==='base64') txt=atob(j.content.replace(/\n/g,''));
  else { const r2=await gh('GET',null,true,G); if(!r2.ok) throw new Error(await errText(r2)); txt=await r2.text(); }
  return {sha:j.sha, blob:txt};
}
async function decryptWithKey(blobStr){
  const o=JSON.parse(blobStr);
  if(o.salt!==b64(SALT)){ const e=new Error('pw'); e.code='pw'; throw e; }
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},KEY,unb64(o.ct));
  return JSON.parse(dec.decode(pt));
}
function adoptRemote(data,sha){
  const gh0=D.settings.gh;
  D=migrate(data); D.settings.gh=gh0; D.sync={sha,dirty:false};
  SYNC.conflict=null; SYNC.at=hhmm(); save(true); setSync('idle'); render();
}
async function syncCheck(){
  if(!D) return;
  if(!ghReady()) return setSync('off');
  if(!navigator.onLine) return setSync('offline');
  if(SYNC.busy) return;
  SYNC.busy=true; setSync('busy'); SYNC.lastCheck=Date.now();
  let action='conflict';
  try{
    const rem=await fetchRemote();
    if(!rem || rem.sha===D.sync.sha){ action=(!rem || D.sync.dirty)?'push':'idle'; }
    else {
      let data=null;
      try{ data=await decryptWithKey(rem.blob); }
      catch(e){ SYNC.conflict={pw:true,blob:rem.blob,sha:rem.sha}; }
      if(data && !D.sync.dirty){ SYNC.busy=false; return adoptRemote(data,rem.sha); }
      if(data) SYNC.conflict={data,sha:rem.sha};
    }
  }catch(e){ SYNC.busy=false; return setSync(navigator.onLine?'error':'offline', e.message); }
  SYNC.busy=false;
  if(action==='push') return pushNow(true,true);
  if(action==='idle'){ SYNC.at=hhmm(); return setSync('idle'); }
  setSync('conflict'); render();
}
async function pushNow(force,fromCheck){
  clearTimeout(SYNC.timer);
  if(!D) return;
  if(!ghReady()) return setSync('off');
  if(SYNC.conflict) return setSync('conflict');
  if(!D.sync.dirty && !force) return;
  if(!navigator.onLine) return setSync('offline');
  if(SYNC.busy){ SYNC.timer=setTimeout(()=>pushNow(force),4000); return; }
  SYNC.busy=true; setSync('busy');
  const rev=EDIT;
  try{
    const blob=await encryptData(true);
    const body={message:`更新人生計畫 ${dkey(new Date())} ${hhmm()}`,content:btoa(blob),branch:D.settings.gh.branch||'main'};
    if(D.sync.sha) body.sha=D.sync.sha;
    const r=await gh('PUT',body);
    if((r.status===409||r.status===422) && !fromCheck){ SYNC.busy=false; return syncCheck(); }
    if(!r.ok) throw new Error(await errText(r));
    const j=await r.json();
    D.sync.sha=j.content.sha; D.sync.dirty=(EDIT!==rev);
    SYNC.at=hhmm(); SYNC.busy=false; save(true);
    if(D.sync.dirty) schedulePush(); else setSync('idle');
  }catch(e){ SYNC.busy=false; setSync(navigator.onLine?'error':'offline', e.message); }
}
function gh(method,body,raw,G){
  G=G||D.settings.gh;
  const url=`https://api.github.com/repos/${encodeURIComponent(G.owner.trim())}/${encodeURIComponent(G.repo.trim())}/contents/${G.path.trim().split('/').map(encodeURIComponent).join('/')}`+(method==='GET'?`?ref=${encodeURIComponent(G.branch||'main')}`:'');
  return fetch(url,{method,cache:'no-store',headers:{'Authorization':'Bearer '+G.token.trim(),'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
}
async function errText(r){
  let m=''; try{ m=(await r.json()).message||''; }catch(e){}
  const hint={401:'Token 無效或已過期',403:'Token 權限不足（需要 Contents 讀寫）',404:'找不到倉庫：請檢查帳號、倉庫名稱，以及 Token 是否授權這個倉庫'}[r.status];
  return `${r.status} ${hint||m}`;
}

function vProg(v){
  const gs=(v.goalIds||[]).map(id=>D.goals.find(g=>g.id===id)).filter(Boolean);
  const parts=[];
  if(gs.length) parts.push(gs.reduce((a,g)=>a+Number(g.progress||0),0)/gs.length);
  if(v.missions&&v.missions.length) parts.push(100*v.missions.filter(m=>m.done).length/v.missions.length);
  return parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):0;
}

function handleImg(el){
  const f=el.files&&el.files[0]; if(!f) return;
  const v=D.vision.cards.find(x=>x.id===el.dataset.img); if(!v) return;
  const img=new Image(), u=URL.createObjectURL(f);
  img.onload=()=>{ const k=Math.min(1,640/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); v.img=c.toDataURL('image/jpeg',0.72); save(); render(); };
  img.onerror=()=>URL.revokeObjectURL(u);
  img.src=u;
}

function itemPath(base,arr,item){ return `${base}.items.${arr.indexOf(item)}`; }

/* 週計畫 */
function vWeek(){
  const ws=S.week, wk=isoWeekKey(ws), W=ensureWeek(wk), tk=dkey(today);
  const days=[...Array(7)].map((_,i)=>addDays(ws,i));
  const strip=days.map(d=>{ const k=dkey(d), dd=D.days[k]; const n=dd?dd.top3.filter(t=>t.done).length:0;
    return `<button class="wday ${k===tk?'today':''}" data-act="day-jump" data-k="${k}"><small>週${WD[d.getDay()]}</small><b>${d.getDate()}</b><small>${dd?n+'/3':'—'}</small></button>`; }).join('');
  const big=W.big3.map((t,i)=>`<div class="check"><span class="num muted">${i+1}</span><input type="text" value="${esc(t)}" data-path="weeks.${wk}.big3.${i}" placeholder="這週一定要完成的大事"></div>`).join('');
  const items=W.items.map((i,idx)=>`<div class="check ${i.done?'done':''}"><input type="checkbox" ${i.done?'checked':''} data-path="weeks.${wk}.items.${idx}.done" aria-label="完成">${chip(i.cat)}<input type="text" class="bare" value="${esc(i.text)}" data-path="weeks.${wk}.items.${idx}.text"><button class="x" data-act="del-item" data-scope="week" data-id="${i.id}" aria-label="刪除">×</button></div>`).join('');
  const yTheme=(D.years[ws.getFullYear()]||{}).theme;
  const last=addDays(ws,6);
  return `
  <div class="navbar"><button class="btn" data-act="week-nav" data-d="-7" aria-label="上一週">‹</button>

  <p class="muted small">${ws.getMonth()+1}/${ws.getDate()} – ${last.getMonth()+1}/${last.getDate()}${yTheme?` · 年度主題：${esc(yTheme)}`:''}</p>

  <div class="grid2">
    <section class="panel"><div class="panel-head"><h2>三顆大石頭</h2><span class="small muted">先放大石頭，再放小石子</span></div>${big}</section>
    <section class="panel"><h2>本週待辦</h2>${items||'<p class="small muted">還沒有待辦。</p>'}
      <div class="row"><select id="wa-cat" style="width:auto">${catOptions('family')}</select><input type="text" id="wa-text" placeholder="新增待辦…" data-enter="add-item" data-scope="week" style="flex:1"><button class="btn sm" data-act="add-item" data-scope="week">加入</button></div></section>
  </div>
  <section class="panel"><h2>週日回顧</h2><div class="grid3">
    <div class="field"><label class="label" for="wr1">這週做得好的</label><textarea id="wr1" data-path="weeks.${wk}.review.good">${esc(W.review.good)}</textarea></div>
    <div class="field"><label class="label" for="wr2">需要調整的</label><textarea id="wr2" data-path="weeks.${wk}.review.improve">${esc(W.review.improve)}</textarea></div>
    <div class="field"><label class="label" for="wr3">下週最重要的事</label><textarea id="wr3" data-path="weeks.${wk}.review.next">${esc(W.review.next)}</textarea></div>
  </div></section>`;
}

/* ---------- events ---------- */
document.addEventListener('input', e=>{
  const el=e.target, p=el.dataset.path; if(!p||!D) return;
  let v = el.type==='checkbox' ? el.checked : (el.type==='range'||el.dataset.num!==undefined) ? Number(el.value) : el.value;
  setPath(D,p,v);
  if(p.startsWith('wheel.')) D.wheelDate=dkey(new Date());
  if(el.dataset.out){ const o=document.getElementById(el.dataset.out); if(o) o.textContent=v+(el.dataset.unit||''); }
  save();
});
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.id==='yearSel'){ S.year=Number(el.value); return render(); }
  if(el.dataset.img){ handleImg(el); return; }
  if(el.dataset.path && (el.type==='checkbox' || el.dataset.rerender!==undefined || el.type==='range')) render();
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const el=e.target;
  if(el.dataset.enter){ e.preventDefault(); ACT[el.dataset.enter](el); }
  else if(el.id==='pw' ) ACT.unlock();
  else if(el.id==='pw2') ACT.create();
});
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const f=ACT[b.dataset.act]; if(f) f(b,e);
});
function msg(id,t,cls){ const m=$('#'+id); if(m){ m.textContent=t; m.className='msg '+(cls||''); } }
function armed(b,label){ if(b.dataset.armed){ return true; } b.dataset.armed='1'; const o=b.textContent; b.textContent=label||'再按一次確認'; b.classList.add('armed'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent=o; b.classList.remove('armed'); } },4000); return false; }

const ACT={
  async create(){
    const a=$('#pw1').value, b=$('#pw2').value;
    if(a.length<6) return msg('lockMsg','密碼至少 6 個字。','err');
    if(a!==b) return msg('lockMsg','兩次輸入的密碼不一樣。','err');
    msg('lockMsg','建立中…');
    SALT=crypto.getRandomValues(new Uint8Array(16)); KEY=await deriveKey(a,SALT); D=seed();
    lsSet(await encryptData(false)); openApp();
  },
  async unlock(){
    const pw=$('#pw').value; if(!pw) return msg('lockMsg','請輸入密碼。','err');
    msg('lockMsg','解密中…');
    try{ const r=await decryptBlob(S.pendingBlob,pw); KEY=r.key; SALT=r.salt; D=migrate(r.data);
      if(S.bootGh){ D.settings.gh={...S.bootGh}; D.sync={sha:S.bootSha,dirty:false}; S.bootGh=null; }
      lsSet(await encryptData(false)); openApp(); }
    catch(e){ msg('lockMsg','密碼不對，或檔案不是這套系統的備份。','err'); }
  },
  async 'lk-load'(){
    const txt=await readImport('lk'); if(!txt) return msg('lockMsg','請先選擇檔案或貼上內容。','err');
    try{ JSON.parse(txt).ct; S.pendingBlob=txt; lockView('unlock','已載入備份，輸入該備份的密碼。'); }
    catch(e){ msg('lockMsg','看不懂這份內容，請確認是 .enc.json 備份。','err'); }
  },
  'reset-local'(b){ if(!armed(b,'確定清除？再按一次')) return; try{ localStorage.removeItem(LS); }catch(e){} S.pendingBlob=null; lockView('create'); },
  lock(){ lockApp(); },
  tab(b){ S.tab=b.dataset.tab; render(); window.scrollTo(0,0); },
  'year-jump'(b){ const y=Number(b.dataset.y); if(y<NOW_Y){ S.tab='review'; } else { S.year=y; S.tab='year'; } render(); window.scrollTo(0,0); },
  'year-nav'(b){ S.year=Math.min(END,Math.max(NOW_Y,S.year+Number(b.dataset.d))); render(); },
  'week-nav'(b){ S.week=addDays(S.week,Number(b.dataset.d)); render(); },
  'week-today'(){ S.week=weekStart(new Date()); render(); },
  'week-of-day'(){ S.week=weekStart(S.day); S.tab='week'; render(); },
  'day-nav'(b){ S.day=addDays(S.day,Number(b.dataset.d)); render(); },
  'day-today'(){ S.day=new Date(); render(); },
  'day-jump'(b){ S.day=parseD(b.dataset.k); S.tab='day'; render(); window.scrollTo(0,0); },
  gfilter(b){ S.gfilter=b.dataset.c; render(); },
  'clear-sample'(b){
    if(!armed(b,'確定清除所有範例？再按一次')) return;
    const keep={profile:D.profile, habits:D.habits, settings:D.settings, sync:D.sync, lastBackup:D.lastBackup};
    D={v:1,isSample:false,profile:{...keep.profile,name:keep.profile.name},habits:keep.habits,wheel:{},wheelDate:'',reflect:{proud:'',regret:'',lessons:'',gratitude:''},
       review:[{id:uid(),year:Number(keep.profile.birthYear)||1978,cat:'family',title:'出生',note:''}],decadeNotes:{},
       phases:{p1:{theme:''},p2:{theme:''},p3:{theme:''},p4:{theme:''}},goals:[],years:{},weeks:{},days:{},settings:keep.settings,vision:{statement:'',mission:'',values:[],cards:[]},mandala:emptyMandala(),sync:keep.sync,lastBackup:keep.lastBackup};
    CATS.forEach(c=>D.wheel[c.id]=5); save(); render();
  },
  'add-review'(){
    const y=Number($('#rv-y').value), t=$('#rv-t').value.trim();
    if(!t || y<START || y>NOW_Y) return $('#rv-t').focus();
    D.review.push({id:uid(),year:y,cat:$('#rv-c').value,title:t,note:$('#rv-n').value.trim()}); save(); render();
  },
  'del-review'(b){ D.review=D.review.filter(e=>e.id!==b.dataset.id); save(); render(); },
  'add-item'(b){
    if(b.dataset.scope==='year'){
      const c=b.dataset.cat, inp=$('#ya-'+c), t=inp.value.trim(); if(!t) return;
      ensureYear(S.year).items.push({id:uid(),cat:c,text:t,done:false});
      save(); render(); const n=$('#ya-'+c); n&&n.focus();
    } else {
      const t=$('#wa-text').value.trim(); if(!t) return;
      const c=$('#wa-cat').value;
      ensureWeek(isoWeekKey(S.week)).items.push({id:uid(),cat:c,text:t,done:false});
      save(); render(); $('#wa-cat').value=c; $('#wa-text').focus();
    }
  },
  'del-item'(b){
    const arr = b.dataset.scope==='year' ? ensureYear(S.year).items : ensureWeek(isoWeekKey(S.week)).items;
    const i=arr.findIndex(x=>x.id===b.dataset.id); if(i>-1) arr.splice(i,1); save(); render();
  },
  'add-goal'(){
    const t=$('#ng-t').value.trim(); if(!t) return $('#ng-t').focus();
    const [c,s]=$('#ng-c').value.split('|');
    D.goals.push({id:uid(),cat:c,sub:s,horizon:$('#ng-h').value,due:Number($('#ng-d').value)||END,title:t,measure:$('#ng-m').value.trim(),why:$('#ng-w').value.trim(),progress:0});
    S.gfilter=c; save(); render();
  },
  'del-goal'(b){ if(!armed(b,'刪？')) return; D.goals=D.goals.filter(g=>g.id!==b.dataset.id); save(); render(); },
  'save-habits'(){ const l=$('#habitsTA').value.split('\n').map(s=>s.trim()).filter(Boolean); if(!l.length) return msg('habMsg','至少留一個習慣。','err'); D.habits=l; save(); msg('habMsg','已更新。','ok'); },
  async export(){
    D.lastBackup=dkey(new Date()); save();
    const blob=await encryptData(true);
    const ta=$('#exportTA'); ta.value=blob; ta.hidden=false;
    const a=$('#dl'); const t=new Date();
    a.href=URL.createObjectURL(new Blob([blob],{type:'application/json'}));
    a.download=`lifeplan-${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}.enc.json`; a.hidden=false;
    $('#cpBtn').hidden=false;
    msg('bkMsg','備份已產生（已加密，Token 不含在內）。下載檔案，或複製內容存到安全的地方。','ok');
  },
  'copy-export'(){
    const ta=$('#exportTA');
    navigator.clipboard.writeText(ta.value).then(()=>msg('bkMsg','已複製。','ok')).catch(()=>{ ta.focus(); ta.select(); msg('bkMsg','請按 Ctrl/⌘+C 複製已選取的內容。'); });
  },
  async 'st-load'(b){
    const txt=await readImport('st'); if(!txt) return msg('bkMsg','請先選擇檔案或貼上內容。','err');
    if(!armed(b,'會覆蓋目前資料，再按一次')) return;
    const pw=$('#st-pw').value;
    try{
      let data;
      if(pw){ data=(await decryptBlob(txt,pw)).data; }
      else { const o=JSON.parse(txt); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},KEY,unb64(o.ct)); if(o.salt!==b64(SALT)) throw 0; data=JSON.parse(dec.decode(pt)); }
      const gh0=D.settings.gh, sha0=D.sync.sha; D=migrate(data); D.settings.gh=gh0; D.sync={sha:sha0,dirty:true}; save(); render(); msg('bkMsg','已還原，稍後自動同步到雲端。','ok');
    }catch(e){ msg('bkMsg','無法解密：請在「備份的密碼」欄輸入當時的密碼。','err'); }
  },
  async 'change-pw'(){
    const o=$('#cp-o').value, n=$('#cp-n').value, n2=$('#cp-n2').value;
    try{ await decryptBlob(lsGet()||await encryptData(false),o); }catch(e){ return msg('pwMsg','目前密碼不對。','err'); }
    if(n.length<6) return msg('pwMsg','新密碼至少 6 個字。','err');
    if(n!==n2) return msg('pwMsg','兩次新密碼不一樣。','err');
    SALT=crypto.getRandomValues(new Uint8Array(16)); KEY=await deriveKey(n,SALT);
    lsSet(await encryptData(false)); msg('pwMsg','密碼已更換。其他裝置下次同步時，會請你輸入新密碼。','ok');
    if(ghReady()){ EDIT++; D.sync.dirty=true; pushNow(true,true); }
  },
  async 'gh-boot'(){
    const G={owner:$('#bo-o').value.trim(),repo:$('#bo-r').value.trim(),branch:'main',path:$('#bo-p').value.trim()||'lifeplan.enc.json',token:$('#bo-t').value.trim()};
    if(!G.owner||!G.repo||!G.token) return msg('lockMsg','請填 GitHub 帳號、資料倉庫和 Token。','err');
    msg('lockMsg','從 GitHub 載入中…');
    try{
      const rem=await fetchRemote(G);
      if(!rem) return msg('lockMsg','倉庫裡還沒有資料檔。請先在原本的裝置到「設定 → 雲端同步」按「連線並同步」。','err');
      JSON.parse(rem.blob).ct;
      S.pendingBlob=rem.blob; S.bootGh=G; S.bootSha=rem.sha;
      lockView('unlock','已從 GitHub 載入，請輸入密碼。');
    }catch(e){ msg('lockMsg','載入失敗：'+e.message,'err'); }
  },
  'sync-now'(){ if(!ghReady()){ S.tab='settings'; render(); return setSync('off','請先填完帳號、資料倉庫、檔名與 Token'); } syncCheck(); },
  'sync-connect'(){ if(!ghReady()) return setSync('off','請填完帳號、資料倉庫、檔名與 Token'); save(true); syncCheck(); },
  'use-remote'(b){
    const c=SYNC.conflict; if(!c) return;
    if(!armed(b,'這台未同步的修改會被取代，再按一次')) return;
    if(c.pw){
      S.bootGh={...D.settings.gh}; S.bootSha=c.sha; S.pendingBlob=c.blob;
      KEY=null; D=null; SALT=null; clearTimeout(saveTimer); clearTimeout(SYNC.timer); SYNC.conflict=null;
      $('#view').innerHTML=''; $('#app').hidden=true; $('#lock').hidden=false;
      return lockView('unlock','雲端資料是用另一組密碼加密的，請輸入那組密碼。');
    }
    adoptRemote(c.data,c.sha);
  },
  'use-local'(b){
    const c=SYNC.conflict; if(!c) return;
    if(!armed(b,'雲端版本會被覆蓋，再按一次')) return;
    D.sync.sha=c.sha; D.sync.dirty=true; SYNC.conflict=null; render(); pushNow(true,true);
  },
  'add-vision'(){
    const t=$('#nv-t').value.trim(); if(!t) return $('#nv-t').focus();
    D.vision.cards.push({id:uid(),cat:$('#nv-c').value,title:t,year:Math.min(END,Math.max(NOW_Y,Number($('#nv-y').value)||END)),note:'',img:'',goalIds:[],missions:[]});
    save(); render();
  },
  'del-vision'(b){ if(!armed(b,'確定刪除？')) return; D.vision.cards=D.vision.cards.filter(v=>v.id!==b.dataset.v); save(); render(); },
  'add-mission'(b){
    const v=D.vision.cards.find(x=>x.id===b.dataset.v); if(!v) return;
    const t=$('#vm-'+v.id).value.trim(); if(!t) return;
    v.missions.push({id:uid(),text:t,done:false}); save(); render();
    const n=$('#vm-'+v.id); n&&n.focus();
  },
  'del-mission'(b){ const v=D.vision.cards.find(x=>x.id===b.dataset.v); if(!v) return; v.missions=v.missions.filter(m=>m.id!==b.dataset.m); save(); render(); },
  'link-goal'(b){
    const v=D.vision.cards.find(x=>x.id===b.dataset.v); if(!v) return;
    const i=v.goalIds.indexOf(b.dataset.g); if(i>-1) v.goalIds.splice(i,1); else v.goalIds.push(b.dataset.g);
    S.openLinks.add(v.id); save(); render();
  },
  'del-img'(b){ const v=D.vision.cards.find(x=>x.id===b.dataset.v); if(!v) return; v.img=''; save(); render(); },
  'add-value'(){ const t=$('#nv-val').value.trim(); if(!t) return; D.vision.values.push(t); save(); render(); const n=$('#nv-val'); n&&n.focus(); },
  'del-value'(b){ D.vision.values.splice(Number(b.dataset.i),1); save(); render(); },
  mcell(b){
    const k=b.dataset.k; S.mcell={k,t:Number(b.dataset.t),a:Number(b.dataset.a)};
    render(); focusEditor();
  },
  mzoom(b){ const v=b.dataset.t; S.mzoom = v==='all'?null : v==='core'?'core' : Number(v); render(); window.scrollTo&&window.scrollTo(0,0); },
  mclose(){ S.mcell=null; render(); },
  mnav(b){ const c=S.mcell; if(!c||c.k!=='a') return; c.a=(c.a+Number(b.dataset.d)+8)%8; render(); focusEditor(); },
  'madd-step'(){ const A=curAct(); const t=$('#ms-new').value.trim(); if(!A||!t) return; A.steps.push({id:uid(),text:t,done:false}); save(); render(); const n=$('#ms-new'); n&&n.focus(); },
  'mdel-step'(b){ const A=curAct(); if(!A) return; A.steps=A.steps.filter(x=>x.id!==b.dataset.i); save(); render(); },
  'madd-log'(){ const A=curAct(); const t=$('#ml-new').value.trim(); if(!A||!t) return; A.log.push({id:uid(),date:dkey(new Date()),note:t}); if(A.status==='未開始') A.status='進行中'; save(); render(); const n=$('#ml-new'); n&&n.focus(); },
  'mdel-log'(b){ const A=curAct(); if(!A) return; A.log=A.log.filter(x=>x.id!==b.dataset.i); save(); render(); },
  'mto-day'(){
    const A=curAct(); if(!A||!A.title.trim()) return msg('mMsg','請先填寫行動名稱。','err');
    const d=ensureDay(dkey(new Date())); const slot=d.top3.find(x=>!x.text.trim());
    if(!slot) return msg('mMsg','今天的三件事已經滿了，請先到日計畫調整。','err');
    slot.text=A.title; save(); msg('mMsg','已加入今天的三件事。','ok');
  },
  'mto-week'(){
    const A=curAct(); if(!A||!A.title.trim()) return msg('mMsg','請先填寫行動名稱。','err');
    const T=D.mandala.themes[S.mcell.t];
    ensureWeek(isoWeekKey(new Date())).items.push({id:uid(),cat:T.cat,text:A.title,done:false}); save(); msg('mMsg','已加入本週待辦。','ok');
  },
  mclear(b){ const c=S.mcell; if(!c||c.k!=='a') return; if(!armed(b,'確定清空？再按一次')) return; D.mandala.themes[c.t].actions[c.a]=mAct(''); save(); render(); },
};

boot();
})();
</script>
